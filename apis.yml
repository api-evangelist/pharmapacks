aid: pharmapacks
name: Pharmapacks
description: >-
  Pharmapacks was a New York-based e-commerce marketplace seller and third-party
  logistics operator, founded in 2010 in Long Island City, that grew into one of the
  largest independent sellers of health, beauty and personal-care goods on Amazon,
  eBay and Walmart Marketplace. The company rebranded as Packable Holdings LLC in
  2021, agreed a SPAC merger with Highland Transcend Partners I Corp. that was
  abandoned in March 2022, and filed for Chapter 11 bankruptcy protection on
  2022-08-28 before ceasing operations and liquidating substantially all of its
  assets. Its differentiator was an internal "Master Brain" marketplace-listing,
  repricing and fulfillment platform, but that technology was operated as an internal
  system and was never published as a public developer program: no developer portal,
  API reference, SDK, webhook catalog or machine-readable contract has ever been
  found on any host the company controlled. The pharmapacks.com domain is today a
  GoDaddy parking lander. A successor brand operating as Packable at packable.com,
  led by Pharmapacks/Packable co-founder Jonathan Webb, sells fulfillment, logistics
  and digital-enablement services and likewise publishes no public API.
